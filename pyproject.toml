[project]
name = "orionos-backend"
version = "0.1.0"
description = "OrionOS FastAPI backend (see backend/). Keep in sync with backend/requirements.txt."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy==2.0.36",
    "psycopg2-binary==2.9.10",
    "pydantic[email]==2.10.3",
    "pydantic-settings==2.7.0",
    "python-jose[cryptography]==3.3.0",
    "bcrypt==4.2.1",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.20",
    "requests==2.32.3",
    "aiofiles==23.2.1",
    "stripe==11.4.1",
]
