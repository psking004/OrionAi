openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 1.0.0
  description: AI Teammate for Solo Developers — FastAPI backend
servers:
  - url: /api/v1
    description: FastAPI backend base path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: projects
    description: Project management
  - name: chat
    description: Chat messages
  - name: status
    description: Project health and AI analysis

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "409":
          description: Email or username taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login and receive JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"

  /projects/:
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects for the current user
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"

  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project by ID
      security:
        - BearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      security:
        - BearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      security:
        - BearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /projects/{projectId}/messages:
    post:
      operationId: addMessage
      tags: [chat]
      summary: Add a chat message to a project
      security:
        - BearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

    get:
      operationId: getMessages
      tags: [chat]
      summary: Get last 10 messages for a project
      security:
        - BearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"

  /projects/{projectId}/status:
    post:
      operationId: analyzeProjectStatus
      tags: [status]
      summary: Run AI analysis and return project health status
      security:
        - BearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStatus"

  /projects/{projectId}/next-steps:
    post:
      operationId: getNextSteps
      tags: [status]
      summary: Get prioritized roadmap and next steps
      security:
        - BearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NextSteps"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string

    RegisterInput:
      type: object
      required: [email, username, password]
      properties:
        email:
          type: string
          format: email
        username:
          type: string
          minLength: 3
          maxLength: 50
        password:
          type: string
          minLength: 8

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    TokenResponse:
      type: object
      required: [access_token, token_type, user_id, username, email]
      properties:
        access_token:
          type: string
        token_type:
          type: string
        user_id:
          type: integer
        username:
          type: string
        email:
          type: string

    UserResponse:
      type: object
      required: [id, email, username, is_active]
      properties:
        id:
          type: integer
        email:
          type: string
        username:
          type: string
        is_active:
          type: boolean

    ProjectInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: ["string", "null"]
        tech_stack:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, paused, completed, archived]
          default: active

    ProjectUpdate:
      type: object
      properties:
        name:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        tech_stack:
          type: ["string", "null"]
        status:
          type: ["string", "null"]
          enum: [active, paused, completed, archived, "null"]

    Project:
      type: object
      required: [id, owner_id, name, status, created_at, updated_at]
      properties:
        id:
          type: integer
        owner_id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        tech_stack:
          type: ["string", "null"]
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MessageInput:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
          minLength: 1
          maxLength: 32000

    Message:
      type: object
      required: [id, project_id, role, content, timestamp]
      properties:
        id:
          type: integer
        project_id:
          type: integer
        role:
          type: string
        content:
          type: string
        timestamp:
          type: string
          format: date-time

    ProjectStatus:
      type: object
      required: [id, project_id, progress, problems, stuck_points, next_steps, missing_features, health_score, created_at]
      properties:
        id:
          type: integer
        project_id:
          type: integer
        progress:
          type: string
          enum: [on_track, needs_attention, at_risk, critical]
        problems:
          type: array
          items:
            type: string
        stuck_points:
          type: array
          items:
            type: string
        next_steps:
          type: array
          items:
            type: string
        missing_features:
          type: array
          items:
            type: string
        health_score:
          type: number
          minimum: 0
          maximum: 100
        created_at:
          type: string
          format: date-time

    NextSteps:
      type: object
      required: [project_id, roadmap, steps]
      properties:
        project_id:
          type: integer
        roadmap:
          type: array
          items:
            type: string
        steps:
          type: array
          items:
            type: string
